name: Windows-App

# Baut die Windows-App, startet sie in einem echten Fenster und erzeugt das Setup.
on:
  push:
    branches: [main, windows]
    paths: ['desktop/**', 'app/src/shared/**', 'app/src/main/assets/**', 'app/build.gradle.kts', 'gradle/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Freies Testvideo der Blender Foundation (Sintel, CC BY)
      - name: Tests mit echtem Fenster und Video
        shell: bash
        run: ./gradlew -p desktop test -Dklartv.window=true -Dklartv.testVideo=https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4

      - name: Programm und Setup bauen
        shell: bash
        run: |
          ./gradlew -p desktop createDistributable
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ISCC=$(ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe" 2>/dev/null | head -1)
          if [ -z "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; fi
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=$VERSION" desktop/installer/KlarTV.iss

      - name: Setup installieren, starten, deinstallieren
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/build/setup/*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName '/VERYSILENT /SUPPRESSMSGBOXES /DIR="C:\Test\Klar TV"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup: $($p.ExitCode)" }
          $app = Start-Process 'C:\Test\Klar TV\KlarTV.exe' -PassThru
          Start-Sleep 25
          if (-not (Get-Process KlarTV -ErrorAction SilentlyContinue)) { throw 'Klar TV läuft nicht' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $i = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($i).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force desktop/build/bilder | Out-Null
          $i.Save("$pwd/desktop/build/bilder/installiert.png")
          Get-Process KlarTV | Stop-Process -Force
          Start-Sleep 2
          $u = Start-Process 'C:\Test\Klar TV\unins000.exe' '/VERYSILENT /SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep 3
          if (Test-Path 'C:\Test\Klar TV\KlarTV.exe') { throw 'Nicht deinstalliert' }

      - name: Bilder und Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-bilder
          path: |
            desktop/build/bilder/
            desktop/build/reports/tests/
            desktop/hs_err*.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Setup hochladen
        uses: actions/upload-artifact@v6
        with:
          name: windows-setup
          path: desktop/build/setup/*.exe
          retention-days: 5
          compression-level: 0
