name: Emulator-Test

# Spielt im Android-Emulator wirklich ab, nimmt auf und lädt herunter, gegen einen nachgebauten Anbieter.
on:
  push:
    branches: [main, funktionen]
    paths: ['app/**', 'tools/demo_server.py', 'gradle/**', '.github/workflows/emulator.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: APKs bauen
        run: ./gradlew assembleMobileDebug assembleMobileDebugAndroidTest

      - name: Testanbieter starten
        run: |
          python3 tools/demo_server.py 8080 > demo_server.log 2>&1 &
          for i in $(seq 1 60); do grep -q bereit demo_server.log && break; sleep 1; done
          curl -sf "http://localhost:8080/player_api.php?username=demo&password=demo"

      - name: Im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_test.sh

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator
          path: |
            emulator-out/
            demo_server.log
          retention-days: 7
          if-no-files-found: ignore
