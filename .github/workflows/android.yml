name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Prüft auch die Prüfsumme der gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v5

      # Alle Tests; die Screenshot-Tests speichern dabei die Bildschirme als PNG
      - name: Tests und Screenshots
        run: ./gradlew recordRoborazziMobileDebug

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testbericht
          path: app/build/reports/tests/
          retention-days: 3

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/build/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Debug-APK bauen
        run: ./gradlew assembleMobileDebug assembleCarDebug
