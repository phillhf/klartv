name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Übersetzungen vollständig
        run: python3 tools/texte.py

      # Prüft auch die Prüfsumme der gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v5

      # Freigabe im Netz für den Test der Aufnahmen auf ein Netzlaufwerk
      - name: Samba-Freigabe
        run: |
          sudo apt-get install -y -qq samba > /dev/null
          sudo mkdir -p /srv/klartv && sudo chmod 777 /srv/klartv
          sudo useradd -M -s /usr/sbin/nologin klartv || true
          printf 'test123\ntest123\n' | sudo smbpasswd -a -s klartv
          printf '[klartv]\n  path = /srv/klartv\n  read only = no\n  valid users = klartv\n  force user = runner\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
          echo "KLARTV_SMB=smb://127.0.0.1/klartv|klartv|test123" >> "$GITHUB_ENV"

      # Alle Tests; die Screenshot-Tests speichern dabei die Bildschirme als PNG
      - name: Tests und Screenshots
        run: ./gradlew recordRoborazziMobileDebug

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testbericht
          path: app/build/reports/tests/
          retention-days: 3

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/build/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Debug-APK bauen
        run: ./gradlew assembleMobileDebug assembleCarDebug --stacktrace
