name: Fokus-Test

# Schneller Einzellauf der Fernbedienungs-Tests ohne Emulator
on:
  push:
    branches: [funktionen]
    paths: ['app/src/test/java/io/github/phillhf/iptv/FocusTest.kt', '.github/workflows/fokus.yml', 'app/src/main/**']

permissions:
  contents: read

jobs:
  fokus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew testMobileDebugUnitTest --tests '*FocusTest*'
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('app/build/test-results/testMobileDebugUnitTest/*FocusTest*.xml'):
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="(\w+)".*?(?:</testcase>|/>)', s, re.S):
                  e = re.search(r'<failure message="(.*?)" type', m.group(0), re.S)
                  print('###', m.group(1), 'FEHLER' if e else 'ok')
                  if e:
                      print(html.unescape(e.group(1))[:3000])
          PY
