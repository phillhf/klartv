name: Release

# Von Hand starten (Actions → Release → Run workflow).
# Baut das App-Bundle (AAB) für den Play Store und eine APK zum direkten Installieren.
on:
  workflow_dispatch:

permissions:
  # Schreiben nur, um AAB und APK im Release abzulegen
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests
        run: ./gradlew testMobileDebugUnitTest

      # Upload-Schlüssel aus den Secrets. Fehlt er, signiert der Debug-Schlüssel (nicht für den Play Store).
      - name: Upload-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Keine Release-Secrets hinterlegt – nur zum Ausprobieren, nicht für den Play Store."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: App-Bundle und APK bauen
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Getrennt: Die Aufteilung nach Prozessor gilt nur für APKs, nicht für App-Bundles
        run: |
          ./gradlew assembleMobileRelease assembleCarRelease
          ./gradlew bundleMobileRelease bundleCarRelease

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Veröffentlicht unter dem Tag v<Version>. Gibt es die Version schon, bricht der Lauf ab:
      # erst versionName in app/build.gradle.kts erhöhen.
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/bundle/mobileRelease/app-mobile-release.aab "KlarTV-$VERSION.aab"
          cp app/build/outputs/bundle/carRelease/app-car-release.aab "KlarTV-$VERSION-Auto.aab"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/mobile/release/app-mobile-$abi-release.apk" "KlarTV-$VERSION-$abi.apk"
          done
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Klar TV $VERSION" --generate-notes KlarTV-"$VERSION"*.aab KlarTV-"$VERSION"*.apk
