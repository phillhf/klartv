name: Release

# Von Hand starten (Actions → Release → Run workflow).
# Baut das App-Bundle (AAB) für den Play Store und eine APK zum direkten Installieren.
on:
  workflow_dispatch:

permissions:
  # Schreiben nur, um AAB und APK im Release abzulegen
  contents: write

jobs:
  # Ohne Zugriff auf den Signaturschlüssel
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Windows-Setup bauen
        shell: bash
        run: |
          ./gradlew -p desktop test createDistributable
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress > /dev/null
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=$VERSION" desktop/installer/KlarTV.iss

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-setup
          path: desktop/build/setup/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: windows
    # Der Signaturschlüssel liegt in dieser Umgebung und ist nur vom Zweig main aus erreichbar.
    # Die Bausteine sind auf feste Stände festgelegt, damit niemand über sie an den Schlüssel kommt.
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Tests
        run: ./gradlew testMobileDebugUnitTest

      # Ohne Schlüssel gibt es kein Release: Mit dem öffentlichen Testschlüssel wären Updates fälschbar
      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signaturschlüssel fehlt, es wird nichts veröffentlicht."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: App-Bundle und APK bauen
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Getrennt: Die Aufteilung nach Prozessor gilt nur für APKs, nicht für App-Bundles
        run: |
          ./gradlew assembleMobileRelease assembleCarRelease
          ./gradlew bundleMobileRelease bundleCarRelease

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Veröffentlicht unter dem Tag v<Version>. Gibt es die Version schon, bricht der Lauf ab:
      # erst versionName in app/build.gradle.kts erhöhen.
      - name: Signatur prüfen
        run: |
          EXPECTED=1eb4188e33169b217c6363f2468746672315d4df9b8e590666ae9b0027e3c3fd
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          count=0
          for f in app/build/outputs/apk/*/release/*.apk; do
            got=$("$TOOLS/apksigner" verify --print-certs "$f" | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | sort -u)
            echo "$f $got"
            [ "$got" = "$EXPECTED" ] || { echo "::error::Falsche Signatur: $f"; exit 1; }
            count=$((count + 1))
          done
          for f in app/build/outputs/bundle/*/*.aab; do
            got=$(keytool -printcert -jarfile "$f" | grep -oP 'SHA256: \K[0-9A-F:]+' | tr -d : | tr A-F a-f | sort -u)
            echo "$f $got"
            [ "$got" = "$EXPECTED" ] || { echo "::error::Falsche Signatur: $f"; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -ge 5 ]

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-setup
          path: ${{ runner.temp }}/windows

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Die Namen sagen, für welches Gerät die Datei ist. Die Links in release-notes.md müssen dazu passen.
          cp app/build/outputs/bundle/mobileRelease/app-mobile-release.aab "KlarTV-$VERSION-NUR-PLAY-STORE.aab"
          cp app/build/outputs/bundle/carRelease/app-car-release.aab "KlarTV-$VERSION-NUR-PLAY-STORE-Auto.aab"
          apk=app/build/outputs/apk/mobile/release/app-mobile
          cp "$apk-arm64-v8a-release.apk" "KlarTV-$VERSION-Handy-Tablet.apk"
          cp "$apk-armeabi-v7a-release.apk" "KlarTV-$VERSION-Fernseher-TV-Stick.apk"
          cp "$RUNNER_TEMP/windows/KlarTV-$VERSION-Windows-Setup.exe" .
          sed "s/@V@/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Klar TV $VERSION" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" KlarTV-"$VERSION"*.aab KlarTV-"$VERSION"*.apk KlarTV-"$VERSION"*.exe
